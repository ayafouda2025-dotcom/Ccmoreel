<!doctype html>
<meta charset="utf-8">
<title>Kara Duo — Reel 05 · Beauty Artist</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#EDE3F0;height:100%}canvas{display:block;height:100vh;margin:auto}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Kara Duo · Reel 05 "لوك كامل" — editorial luxury product film for the 57-piece Beauty Artist bag.
// Light ivory/lavender stage, real product photos (white backgrounds dissolve via multiply), Playfair numerals, Cairo type.
// Every frame is a pure function of t (window.seek).
const W = 1080, H = 1920, DUR = 29.6;
const g = document.getElementById('c').getContext('2d');
const C = { ivory: '#FAF7F8', lav: '#D0B9D9', lavL: '#E7DAEC', lavLL: '#F3ECF6', lavD: '#A98BB5', mauve: '#654A70', mauveD: '#4F3859', ink: '#2B1C33', pink: '#DD4E94', pinkL: '#E98ABC', pinkLL: '#F8E1EE', blush: '#F6E7EF' };

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k;
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3), easeIn = (x) => Math.pow(clamp(x), 3);
const easeInOut = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const expo = (x) => { x = clamp(x); return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); };
function spring(t, k = 170, d = 26) { if (t <= 0) return 0; const w0 = Math.sqrt(k), z = d / (2 * w0);
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t); }
const SOFT = (t) => spring(t, 120, 22), SILK = (t) => spring(t, 90, 19), POP = (t) => spring(t, 220, 18);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const AR = (n) => String(n).replace(/[0-9]/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);

const IMG = {};
function loadImg(k, src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => { IMG[k] = i; res(); }; i.onerror = rej; i.src = src; }); }
function tint(img, color) { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; const x = c.getContext('2d'); x.drawImage(img, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height); return c; }

function text(s, x, y, { size = 60, weight = 800, family = 'Cairo', color = C.mauve, align = 'center', alpha = 1, spacing = 0, maxW = 0, italic = false } = {}) {
  g.save(); g.globalAlpha *= alpha; g.font = `${italic ? 'italic ' : ''}${weight} ${size}px "${family}"`;
  if (maxW) { const w = g.measureText(s).width; if (w > maxW) { size *= maxW / w; g.font = `${italic ? 'italic ' : ''}${weight} ${size}px "${family}"`; } }
  if (spacing) g.letterSpacing = spacing + 'px'; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle';
  g.direction = /[؀-ۿ]/.test(s) ? 'rtl' : 'ltr'; g.fillText(s, x, y); g.restore();
}
// text revealed by a mask that slides up (classic editorial reveal)
function revealText(s, x, y, k, opt = {}) { if (k <= 0) return; const size = opt.size || 60;
  g.save(); g.beginPath(); g.rect(0, y - size * 0.95, W, size * 1.9); g.clip(); text(s, x, y + (1 - easeOut(k)) * size * 1.2, { ...opt, alpha: (opt.alpha ?? 1) * clamp(k * 2) }); g.restore(); }
// product photo on white, dissolved into the light background
function product(key, cx, cy, h, { rot = 0, alpha = 1, shadow = true } = {}) {
  const im = IMG[key]; if (!im || h <= 0) return; const w = h * im.width / im.height;
  g.save(); g.translate(cx, cy); g.rotate(rot); g.globalAlpha *= alpha;
  if (shadow) { g.save(); g.globalAlpha *= 0.35; const gr = g.createRadialGradient(0, h * 0.5, 0, 0, h * 0.5, w * 0.6); gr.addColorStop(0, 'rgba(101,74,112,.55)'); gr.addColorStop(1, 'rgba(101,74,112,0)');
    g.fillStyle = gr; g.beginPath(); g.ellipse(0, h * 0.5, w * 0.6, h * 0.08, 0, 0, Math.PI * 2); g.fill(); g.restore(); }
  g.globalCompositeOperation = 'multiply'; g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(im, -w / 2, -h / 2, w, h); g.restore();
}
function hairline(x0, y0, x1, y1, k, col = C.lavD, w = 3) { if (k <= 0) return; g.save(); g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(x0, y0); g.lineTo(lerp(x0, x1, easeOut(k)), lerp(y0, y1, easeOut(k))); g.stroke(); g.restore(); }
function sparkle(x, y, r, col = C.pink, a = 1) { if (r <= 0) return; g.save(); g.globalAlpha *= a; g.fillStyle = col; g.beginPath();
  g.moveTo(x, y - r); g.quadraticCurveTo(x, y, x + r, y); g.quadraticCurveTo(x, y, x, y + r); g.quadraticCurveTo(x, y, x - r, y); g.quadraticCurveTo(x, y, x, y - r); g.fill(); g.restore(); }
function pill(cx, cy, w, h, fill) { g.save(); g.shadowColor = 'rgba(101,74,112,.25)'; g.shadowBlur = 30; g.shadowOffsetY = 12; g.fillStyle = fill; g.beginPath(); g.roundRect(cx - w / 2, cy - h / 2, w, h, h / 2); g.fill(); g.restore(); }
function logo(cx, cy, w, col = 'M', a = 1) { const L = col === 'M' ? IMG.logoM : IMG.logoW; if (!L) return; const h = w * L.height / L.width; g.save(); g.globalAlpha *= a; g.drawImage(L, cx - w / 2, cy - h / 2, w, h); g.restore(); }

// ---------- stage ----------
function stage(t, tone = 0) {
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, C.ivory); gr.addColorStop(1, tone ? '#EFE2F3' : '#F4EBF4'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.save(); g.filter = 'blur(90px)'; g.globalAlpha = 0.55;
  [[200, 400, 260, C.pinkLL], [900, 1300, 320, C.lavL], [300, 1750, 280, C.lavLL]].forEach(([x, y, r, c], i) => { g.fillStyle = c; g.beginPath(); g.arc(x + Math.sin(t * 0.3 + i) * 50, y + Math.cos(t * 0.25 + i) * 40, r, 0, Math.PI * 2); g.fill(); });
  g.restore();
}
function grain(t) { const r = rng(Math.floor(t * 24) + 7); g.save(); g.globalAlpha = 0.05; for (let i = 0; i < 900; i++) { g.fillStyle = r() > 0.5 ? '#fff' : '#654A70'; g.fillRect(r() * W, r() * H, 2, 2); } g.restore(); }
function sweep(t, t0, dur = 0.9, a = 0.55) { const d = (t - t0) / dur; if (d < 0 || d > 1) return; g.save(); g.globalCompositeOperation = 'screen'; g.translate(lerp(-500, W + 500, easeInOut(d)), H / 2); g.rotate(0.35);
  const gr = g.createLinearGradient(-160, 0, 160, 0); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, `rgba(255,255,255,${a})`); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(-160, -1500, 320, 3000); g.restore(); }

// ================= S1 opening 0–4.9: macro of the bag's line-art face, slow pull-back =================
function sOpen(t) {
  stage(t);
  const z = lerp(3.6, 1, easeInOut((t - 0.1) / 4.3)), im = IMG.bagc, h = 640 * z, w = h * im.width / im.height;
  // focus point: the illustrated face on the bag front (fraction of the photo)
  const fx = 0.25, fy = 0.42, ax = lerp(540, 540, 0), ay = lerp(1020, 1230, easeInOut((t - 0.1) / 4.3));
  g.save(); g.globalAlpha = clamp(t * 3); g.translate(ax - (fx - 0.5) * w * lerp(1, 0, easeInOut((t - 0.1) / 4.3)), ay - (fy - 0.5) * h * lerp(1, 0, easeInOut((t - 0.1) / 4.3)));
  g.globalCompositeOperation = 'multiply'; g.imageSmoothingQuality = 'high'; g.drawImage(im, -w / 2, -h / 2, w, h); g.restore();
  // a soft ivory veil over the top for the type
  const vg = g.createLinearGradient(0, 0, 0, 820); vg.addColorStop(0, 'rgba(250,247,248,.96)'); vg.addColorStop(1, 'rgba(250,247,248,0)'); g.fillStyle = vg; g.fillRect(0, 0, W, 820);
  text('KARA DUO  ·  BEAUTY ARTIST', 540, 150, { size: 24, weight: 600, family: 'Montserrat', color: C.lavD, spacing: 8, alpha: clamp((t - 0.3) * 2) });
  revealText('لوك كامل', 540, 310, (t - 1.0) / 0.45, { size: 170, weight: 900, color: C.mauve });
  hairline(340, 425, 740, 425, (t - 1.7) / 0.6, C.pinkL, 4);
  revealText('من أول خطوة… لآخر لمسة', 540, 500, (t - 2.0) / 0.5, { size: 58, weight: 600, color: C.mauveD });
  sweep(t, 3.4, 1.1, 0.7);
  for (let i = 0; i < 5; i++) { const r = rng(10 + i), x = 200 + r() * 680, y = 760 + r() * 900, ti = 3.5 + i * 0.12; sparkle(x, y, 18 * Math.sin(clamp((t - ti) / 0.9) * Math.PI), i % 2 ? C.pinkL : C.ivory, 0.9); }
}

// ================= S2 the 8 steps 4.9–11.9 =================
const STEPS = [
  ['تحضير', 'PREP', 5.11, [['primer', 0, 0, 760, -0.06]], C.ivory],
  ['تصحيح', 'CORRECT', 5.98, [['cn1', 0, 0, 380, 0.04]], '#F7EEF4'],
  ['كونتور', 'CONTOUR', 6.86, [['contour', 0, 0, 700, -0.05]], '#F4ECE7'],
  ['بلاشر', 'BLUSH', 7.73, [['flora', 60, -40, 500, 0.06], ['liqblush', -250, 90, 560, -0.1]], '#FBEAF1'],
  ['عيون', 'EYES', 8.51, [['pro12', 40, -60, 560, -0.04], ['mascara', -300, 120, 640, 0.12], ['brow', 330, 160, 600, -0.18]], '#F1ECF6'],
  ['إضاءة', 'GLOW', 9.30, [['halo', 160, -120, 400, 0.05], ['starx', -270, 40, 620, -0.08], ['glowcrush', 170, 260, 430, 0.04]], '#FBF3EA'],
  ['شفايف', 'LIPS', 10.04, [['radrouge', 120, -40, 560, 0.04], ['vibeout', -290, 60, 700, -0.08]], '#FCE9EE'],
  ['تثبيت', 'SET', 11.0, [['spray', -280, 0, 640, -0.04], ['loose', 150, -170, 420, 0.03], ['blur', 170, 250, 430, -0.03]], '#F2EEF7'],
];
function sSteps(t) {
  let cur = 0; STEPS.forEach((s, i) => { if (t >= s[2] - 0.12) cur = i; });
  // each step's colour panel slides in from the right over the previous (RTL wipe)
  for (let i = 0; i <= cur; i++) {
    const [ar, en, ti, items, bgc] = STEPS[i], d = t - (ti - 0.12), slide = i === 0 ? 1 : expo(d / 0.42);
    const x0 = (1 - slide) * W; if (i < cur - 1) continue;
    g.save(); g.beginPath(); g.rect(x0, 0, W, H); g.clip();
    g.fillStyle = bgc; g.fillRect(0, 0, W, H);
    const par = (1 - slide) * 260;                                  // inner parallax: content travels a little further
    // giant outline numeral
    g.save(); g.font = 'italic 500 520px "Playfair Display"'; g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.strokeStyle = 'rgba(169,139,181,.55)'; g.lineWidth = 3;
    g.strokeText('0' + (i + 1), 70 + x0 * 0.4 + par * 0.3, 760); g.restore();
    // product(s)
    items.forEach(([key, dx, dy, h, rot], j) => { const k = SOFT(d - 0.05 - j * 0.07); product(key, 560 + dx + x0 + par + (1 - k) * 120, 1060 + dy + Math.sin(t * 1.4 + j) * 8, h * (0.92 + 0.08 * k), { rot: rot + Math.sin(t * 0.9 + j) * 0.015, alpha: clamp(k * 2) }); });
    // step name (Arabic big, Latin eyebrow)
    const nk = (d - 0.06) / 0.35;
    text(en, 1000 + x0 + par * 0.6, 300, { size: 26, weight: 600, family: 'Montserrat', color: C.pink, align: 'right', spacing: 10, alpha: clamp(nk * 2) });
    g.save(); g.beginPath(); g.rect(x0, 330, W, 230); g.clip(); text(ar, 1000 + x0 + par * 0.8, 440 + (1 - easeOut(nk)) * 120, { size: 190, weight: 900, color: C.mauve, align: 'right' }); g.restore();
    g.restore();
  }
  // progress rail (8 steps)
  const pk = clamp((t - 4.95) * 3);
  g.save(); g.globalAlpha = pk;
  for (let i = 0; i < 8; i++) { const x = 960 - i * 120, on = i <= cur; g.fillStyle = on ? C.pink : 'rgba(169,139,181,.45)'; g.beginPath(); g.roundRect(x - 44, 1720, 88, 8, 4); g.fill(); }
  text(`${AR(cur + 1)} / ${AR(8)}`, 540, 1790, { size: 34, weight: 700, color: C.lavD });
  g.restore();
}

// ================= S3 57 pieces → one bag 11.9–15.8 =================
const ALL = ['primer', 'cn1', 'contour', 'flora', 'liqblush', 'pro12', 'mascara', 'brow', 'halo', 'starx', 'glowcrush', 'radrouge', 'vibeout', 'spray', 'loose', 'blur', 'es25', 'aloha'];
function sCount(t) {
  stage(t, 1);
  const n = Math.round(expo((t - 12.3) / 1.4) * 57);
  // products orbit, then get pulled into the bag on "في شنطة وحدة"
  const pull = easeInOut((t - 14.45) / 0.7);
  ALL.forEach((key, i) => { const a = i / ALL.length * Math.PI * 2 + t * 0.35, rx = 440, ry = 700;
    const x = lerp(540 + Math.cos(a) * rx, 540, pull), y = lerp(1000 + Math.sin(a) * ry, 1210, pull), h = lerp(170 + (i % 3) * 30, 20, pull);
    const k = SOFT(t - 11.95 - i * 0.04); product(key, x, y, h * k, { shadow: false, alpha: clamp(k * 2) * (1 - clamp((t - 14.65) / 0.3)) }); });
  { const gl = g.createRadialGradient(540, 1000, 0, 540, 1000, 420); gl.addColorStop(0, 'rgba(250,247,248,.95)'); gl.addColorStop(0.7, 'rgba(250,247,248,.8)'); gl.addColorStop(1, 'rgba(250,247,248,0)'); g.save(); g.globalAlpha = 1 - clamp((t - 14.3) / 0.35); g.fillStyle = gl; g.fillRect(0, 500, W, 1000); g.restore(); }
  // the number
  g.save(); g.globalAlpha = 1 - clamp((t - 14.3) / 0.35);
  text(AR(n), 540, 900, { size: 420, weight: 700, family: 'Playfair Display', color: C.mauve });
  revealText('قطعة من كارا دو', 540, 1180, (t - 13.0) / 0.45, { size: 74, weight: 800, color: C.pink });
  g.restore();
  // the closed bag rises
  const bk = SILK(t - 14.3); if (bk > 0) product('bagc', 540, 1060 + (1 - bk) * 500, 700 * (0.85 + 0.15 * bk), { alpha: clamp(bk * 2) });
  revealText('في شنطة وحدة', 540, 420, (t - 14.5) / 0.45, { size: 96, weight: 900, color: C.mauve });
  if (t > 15.2) sweep(t, 15.15, 0.7, 0.6);
}

// ================= S4 features on the open bag 15.8–21.4 =================
function callout(t, ti, ax, ay, lx, ly, ar, en, align) {
  const k = (t - ti) / 0.45; if (k <= 0) return;
  g.save(); g.fillStyle = C.pink; g.beginPath(); g.arc(ax, ay, 14 * POP(t - ti), 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(221,78,148,.35)'; g.lineWidth = 3; g.beginPath(); g.arc(ax, ay, 14 + 26 * ((t * 1.2) % 1), 0, Math.PI * 2); g.stroke(); g.restore();
  hairline(ax, ay, lx, ly, k, C.pink, 3);
  const tk = (t - ti - 0.25) / 0.45;
  revealText(ar, lx + (align === 'right' ? 0 : 0), ly - 40, tk, { size: 56, weight: 800, color: C.mauve, align });
  text(en, lx, ly + 22, { size: 22, weight: 600, family: 'Montserrat', color: C.lavD, align, spacing: 6, alpha: clamp(tk * 2) });
}
function sBag(t) {
  stage(t);
  const ok = SILK(t - 15.8); product('bago', 560, 900 + (1 - ok) * 80, 860 * (0.94 + 0.06 * ok), { alpha: clamp(ok * 2) });
  sweep(t, 16.0, 0.9, 0.55);
  text('THE BEAUTY ARTIST BAG', 540, 260, { size: 26, weight: 600, family: 'Montserrat', color: C.lavD, spacing: 10, alpha: clamp((t - 15.9) * 2) });
  callout(t, 16.04, 420, 1090, 990, 1440, 'فواصل تترتب على كيفك', 'REARRANGEABLE DIVIDERS', 'right');
  callout(t, 18.15, 830, 820, 990, 1600, '٤ شنط شفافة', '4 DETACHABLE CLEAR POUCHES', 'right');
  // wheel macro in a circle
  const wk = SOFT(t - 19.66);
  if (wk > 0) { g.save(); g.translate(250, 1560); g.scale(wk, wk); g.shadowColor = 'rgba(101,74,112,.3)'; g.shadowBlur = 40; g.fillStyle = C.ivory; g.beginPath(); g.arc(0, 0, 170, 0, Math.PI * 2); g.fill(); g.shadowColor = 'transparent';
    g.beginPath(); g.arc(0, 0, 160, 0, Math.PI * 2); g.clip(); const im = IMG.wheel; g.drawImage(im, -170, -200, 340, 340 * im.height / im.width); g.restore();
    g.save(); g.strokeStyle = C.pinkL; g.lineWidth = 4; g.setLineDash([10, 14]); g.translate(250, 1560); g.rotate(t * 1.5); g.beginPath(); g.arc(0, 0, 192 * wk, 0, Math.PI * 2); g.stroke(); g.restore();
    revealText('وعجلات تمشي معك', 990, 1760, (t - 19.9) / 0.45, { size: 56, weight: 800, color: C.mauve, align: 'right' }); }
}

// ================= S5 ending 21.4–29.6 =================
function sEnd(t) {
  stage(t);
  // pedestal + closed bag
  const bk = SILK(t - 21.45);
  g.save(); g.globalAlpha = clamp(bk * 2); const pg = g.createRadialGradient(540, 1040, 0, 540, 1040, 380); pg.addColorStop(0, 'rgba(208,185,217,.55)'); pg.addColorStop(1, 'rgba(208,185,217,0)'); g.fillStyle = pg; g.beginPath(); g.ellipse(540, 1040, 380, 70, 0, 0, Math.PI * 2); g.fill(); g.restore();
  product('bagc', 540, 760 + (1 - bk) * 90 + Math.sin(t * 1.2) * 6, 560 * (0.9 + 0.1 * bk), { alpha: clamp(bk * 2) });
  sweep(t, 22.3, 1.0, 0.65);
  for (let i = 0; i < 6; i++) { const a = t * 0.6 + i * Math.PI / 3; sparkle(540 + Math.cos(a) * 380, 760 + Math.sin(a) * 300, 14 * clamp((t - 22) * 2) * (0.6 + 0.4 * Math.sin(t * 3 + i)), i % 2 ? C.pinkL : C.lavD, 0.8); }
  // title, word by word
  revealText('شنطة بيوتي ارتست', 540, 1180, (t - 21.84) / 0.5, { size: 84, weight: 900, color: C.mauve });
  revealText('المتكاملة', 540, 1290, (t - 23.15) / 0.45, { size: 84, weight: 900, color: C.pink });
  text('57 PIECES  ·  ONE BAG', 540, 1385, { size: 24, weight: 600, family: 'Montserrat', color: C.lavD, spacing: 8, alpha: clamp((t - 23.5) * 2) });
  // logo + slogan
  const lk = SOFT(t - 24.05); logo(540, 1490, 380 * (0.9 + 0.1 * lk), 'M', clamp(lk * 2));
  revealText('صُنع ليعتني بجمالك', 540, 1585, (t - 24.3) / 0.6, { size: 54, weight: 700, color: C.mauveD });
  // CTA
  const ck = POP(t - 26.6), press = t > 27.6 ? 1 - 0.05 * Math.sin(clamp((t - 27.6) / 0.3) * Math.PI) : 1;
  if (ck > 0) { g.save(); g.translate(540, 1720); g.scale(ck * press, ck * press); pill(0, 0, 700, 120, C.pink); text('اطلبيها من karaduo.com', 0, -2, { size: 46, weight: 800, color: '#fff' }); g.restore(); }
  text('البكجات  ←  شنطة بيوتي ارتست المتكاملة', 540, 1825, { size: 30, weight: 600, family: 'Tajawal', color: C.lavD, alpha: clamp((t - 26.9) * 2) });
  if (t > 27.6 && t < 28.2) { const d = (t - 27.6) / 0.6; g.strokeStyle = `rgba(221,78,148,${1 - d})`; g.lineWidth = 6; g.beginPath(); g.roundRect(540 - 350 - d * 40, 1660 - d * 40, 700 + d * 80, 120 + d * 80, 60 + d * 40); g.stroke(); }
}

// ---------- transitions ----------
function veil(t, tc, dur = 0.5, col = C.ivory) { const d = 1 - Math.abs((t - tc) / (dur / 2)); if (d <= 0) return; g.save(); g.globalAlpha = easeInOut(d); g.fillStyle = col; g.fillRect(0, 0, W, H); g.restore(); }

const SCENES = [[0, 4.95, sOpen], [4.95, 11.9, sSteps], [11.9, 15.8, sCount], [15.8, 21.4, sBag], [21.4, 29.61, sEnd]];
function draw(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over';
  for (const [a, b, fn] of SCENES) if (t >= a && t < b) fn(t);
  veil(t, 11.9, 0.45); veil(t, 15.8, 0.5); veil(t, 21.4, 0.55);
  grain(t);
  // very soft vignette
  const v = g.createRadialGradient(540, 960, 600, 540, 960, 1250); v.addColorStop(0, 'rgba(101,74,112,0)'); v.addColorStop(1, 'rgba(101,74,112,.12)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
}
window.__ready = false; window.seek = (t) => { draw(t); return true; };
(async () => {
