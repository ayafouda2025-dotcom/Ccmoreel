<!doctype html>
<meta charset="utf-8">
<title>Kara Duo — Play & Win explainer</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="edl.js"></script>
<script src="overlay_data.js"></script>
<script>
// Overlay layer for the "العبي واربحي" explainer. The real screen recording is composited UNDER this layer
// through the transparent phone-screen hole. Every frame is a pure function of t (window.seek).
const W = 1080, H = 1920, V = new URLSearchParams(location.search).get('v') || 'long';
const g = document.getElementById('c').getContext('2d');
const C = { ivory: '#FAF7F8', lav: '#D0B9D9', lavL: '#E7DAEC', lavLL: '#F3ECF6', lavD: '#A98BB5', mauve: '#654A70', mauveD: '#4F3859', ink: '#2B1C33', pink: '#DD4E94', pinkL: '#E98ABC', pinkLL: '#F8D7E8', pinkD: '#C93E82', gold: '#F2C14E' };
const SX = 280, SY = 650, SW = 520, SH = 1126, SR = 54;            // phone screen hole
const cx = (x) => SX + x * SW / 390, cy = (y) => SY + y * SH / 844;   // page CSS px -> canvas px

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k;
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3), easeIn = (x) => Math.pow(clamp(x), 3);
function spring(t, k = 170, d = 26) { if (t <= 0) return 0; const w0 = Math.sqrt(k), z = d / (2 * w0);
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t); }
const SNAP = (t) => spring(t, 320, 26), POP = (t) => spring(t, 240, 15), SOFT = (t) => spring(t, 150, 22);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- timeline ----------
const EDL = window.EDL[V];
const clipAt = (t) => { for (let i = EDL.length - 1; i >= 0; i--) if (t >= EDL[i][5]) return i; return 0; };
function srcTime(t) { const [s, a, b, sp, , st] = EDL[clipAt(t)]; return { src: s, t: Math.min(b, a + (t - st) * sp) }; }
const LONG = {
  end: 41.4, caps: [
    [0, 2.5, '', ['العبي واربحي', 'مع كارا دو'], 1],
    [2.5, 5.4, 'طريقة اللعب', ['حرّكي الشنطة واجمعي', 'منتجات كارا دو']],
    [5.4, 10.3, 'طريقة اللعب', ['تجنبي اللي حوله دائرة منقطة،', 'والنجمة الوردية نقاطها أكثر']],
    [10.3, 14.8, 'وقت اللمعة', ['5 ورا بعض = وقت اللمعة:', 'شنطة أوسع ونقاط ×2']],
    [14.8, 19.2, 'رحلة الهدية', ['9 مراحل تكمّل لوكك،', 'وفي آخرها هدية الشهر لك']],
    [19.2, 22.7, 'اكشطي واربحي', ['كل يوم كرت:', '10 نقاط أو شحن مجاني']],
    [22.7, 28.3, 'هذا ولا هذا؟', ['تحدّي صاحبتك، وإذا توافقكم', '90% أو أكثر تربحون الثنتين 10 نقاط']],
    [28.3, 34.0, 'كودك', ['شاركي كودك: صاحبتك تاخذ 10%،', 'وانتي تربحين 10 نقاط عن كل طلب يوصل']],
    [34.0, 38.2, 'استبدال النقاط', ['100 نقطة = خصم 60 ر.س', 'على سلة 150 ر.س أو أكثر']],
    [38.2, 41.4, 'استبدال النقاط', ['1000 نقطة = 50 ر.س', 'كاش باك في محفظتك']],
  ],
  hazard: [5.4, 10.3], fever: [10.3, 14.8], journey: [16.4, 19.2], code: [28.3, 34.0], redeem: [[34.0, 38.2, 0], [38.2, 41.4, 1]], tot: [24.8, 28.3],
};
const SHORT = {
  end: 12.9, caps: [
    [0, 2.4, '', ['العبي واربحي', 'مع كارا دو'], 1],
    [2.4, 4.3, 'طريقة اللعب', ['حرّكي الشنطة واجمعي', 'منتجات كارا دو']],
    [4.3, 6.8, 'طريقة اللعب', ['تجنبي اللي حوله دائرة منقطة،', 'والنجمة الوردية نقاطها أكثر']],
    [6.8, 9.6, 'اكشطي واربحي', ['كل يوم كرت:', '10 نقاط أو شحن مجاني']],
    [9.6, 11.3, 'استبدال النقاط', ['100 نقطة = خصم 60 ر.س', 'على سلة 150 ر.س أو أكثر']],
    [11.3, 12.9, 'استبدال النقاط', ['1000 نقطة = 50 ر.س', 'كاش باك في محفظتك']],
  ],
  hazard: [4.3, 6.8], fever: null, journey: null, code: null, redeem: [[9.6, 11.3, 0], [11.3, 12.9, 1]], tot: null,
};
const S = V === 'short' ? SHORT : LONG, DUR = EDL.reduce((a, c) => a + (c[2] - c[1]) / c[3] + c[4], 0);
const inR = (r, t) => r && t >= r[0] && t < r[1];

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function text(s, x, y, { size = 54, weight = 800, family = 'Cairo', color = C.mauve, align = 'center', alpha = 1, maxW = 0 } = {}) {
  g.save(); g.globalAlpha *= alpha; g.font = `${weight} ${size}px "${family}"`;
  if (maxW) { const w = g.measureText(s).width; if (w > maxW) { size *= maxW / w; g.font = `${weight} ${size}px "${family}"`; } }
  g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle'; g.direction = /[؀-ۿ]/.test(s) ? 'rtl' : 'ltr'; g.fillText(s, x, y); g.restore();
}
function sparkle(x, y, r, col = C.pink, a = 1) { g.save(); g.globalAlpha *= a; g.fillStyle = col; g.beginPath();
  g.moveTo(x, y - r); g.quadraticCurveTo(x, y, x + r, y); g.quadraticCurveTo(x, y, x, y + r); g.quadraticCurveTo(x, y, x - r, y); g.quadraticCurveTo(x, y, x, y - r); g.fill(); g.restore(); }
function flower(x, y, r, a) { g.save(); g.globalAlpha *= a; g.translate(x, y); for (let k = 0; k < 4; k++) { g.rotate(Math.PI / 2); g.fillStyle = k % 2 ? C.pinkL : C.lav; g.beginPath(); g.ellipse(r * 0.55, 0, r * 0.55, r * 0.32, 0, 0, Math.PI * 2); g.fill(); } g.fillStyle = C.pink; g.beginPath(); g.arc(0, 0, r * 0.18, 0, Math.PI * 2); g.fill(); g.restore(); }

// ---------- background, arch, logo ----------
function background(t) {
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#FBF6FB'); gr.addColorStop(0.55, '#F1E6F4'); gr.addColorStop(1, '#E4D2EC');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // soft orbs
  g.save(); g.filter = 'blur(80px)'; [[160, 520, 220, C.pinkLL], [930, 1180, 260, C.lavL], [220, 1700, 240, C.lav]].forEach(([x, y, r, c], i) => { g.globalAlpha = 0.7; g.fillStyle = c; g.beginPath(); g.arc(x + Math.sin(t * 0.5 + i) * 40, y + Math.cos(t * 0.4 + i) * 30, r, 0, Math.PI * 2); g.fill(); }); g.restore();
  // khuzama scatter
  const r = rng(5); for (let i = 0; i < 16; i++) { const x = r() * W, y = 640 + r() * 1280, s = 18 + r() * 22; if (Math.abs(x - 540) < 330) continue; flower(x, y + Math.sin(t * 0.8 + i) * 8, s, 0.35); }
  for (let i = 0; i < 14; i++) { const x = r() * W, y = r() * H, s = 8 + r() * 10; sparkle(x, y, s * (0.75 + 0.25 * Math.sin(t * 3 + i)), i % 2 ? C.pinkL : C.lavD, 0.55); }
  // the game's arch behind the phone
  g.save(); g.strokeStyle = 'rgba(169,139,181,.35)'; g.lineWidth = 26; g.beginPath(); g.moveTo(140, 1920); g.lineTo(140, 1090); g.arc(540, 1090, 400, Math.PI, 0); g.lineTo(940, 1920); g.stroke(); g.restore();
}
function logo(y, w, a = 1) { const L = IMG.logo; if (!L) return; const h = w * L.height / L.width; g.save(); g.globalAlpha *= a; g.drawImage(L, 540 - w / 2, y - h / 2, w, h); g.restore(); }

// ---------- phone ----------
function phone(t, k) {
  const off = (1 - k) * 1300;
  g.save(); g.translate(0, off);
  // shadow + body
  g.save(); g.shadowColor = 'rgba(62,43,71,.35)'; g.shadowBlur = 60; g.shadowOffsetY = 30; rr(SX - 26, SY - 26, SW + 52, SH + 52, SR + 24); g.fillStyle = '#2E2135'; g.fill(); g.restore();
  rr(SX - 26, SY - 26, SW + 52, SH + 52, SR + 24); g.fillStyle = '#3A2A43'; g.fill();
  rr(SX - 20, SY - 20, SW + 40, SH + 40, SR + 18); g.fillStyle = '#20161F'; g.fill();
  g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 3; rr(SX - 25, SY - 25, SW + 50, SH + 50, SR + 23); g.stroke();
  g.fillStyle = '#3A2A43'; g.fillRect(SX + SW + 24, SY + 220, 8, 90); g.fillRect(SX - 32, SY + 180, 8, 60); g.fillRect(SX - 32, SY + 260, 8, 110);
  // punch the screen hole (transparent) so the recording shows through
  g.globalCompositeOperation = 'destination-out'; rr(SX, SY, SW, SH, SR); g.fill(); g.globalCompositeOperation = 'source-over';
  g.restore();
  return off;
}
function inScreen(off, fn) { g.save(); g.translate(0, off); rr(SX, SY, SW, SH, SR); g.clip(); fn(); g.restore(); }

// ---------- caption card ----------
function caption(t) {
  const c = S.caps.find(([a, b]) => t >= a && t < b); if (!c) return;
  const [a, b, chip, lines, big] = c, k = SNAP(t - a), out = clamp((b - t) / 0.18);
  g.save(); g.globalAlpha = Math.min(1, out); g.translate(540, 430); g.scale(0.92 + 0.08 * k, 0.92 + 0.08 * k); g.globalAlpha *= clamp(k * 2.5);
  if (big) {
    text(lines[0], 0, -30, { size: 118, weight: 900, color: C.mauve });
    text(lines[1], 0, 90, { size: 70, weight: 700, color: C.pink });
  } else {
    g.save(); g.shadowColor = 'rgba(101,74,112,.18)'; g.shadowBlur = 40; g.shadowOffsetY = 14; rr(-480, -150, 960, 300, 44); g.fillStyle = 'rgba(250,247,248,.94)'; g.fill(); g.restore();
    g.strokeStyle = C.lavL; g.lineWidth = 4; rr(-480, -150, 960, 300, 44); g.stroke();
    g.font = '800 34px "Cairo"'; const cw = g.measureText(chip).width + 70; rr(-cw / 2, -178, cw, 64, 32); g.fillStyle = C.pink; g.fill();
    text(chip, 0, -147, { size: 34, weight: 800, color: '#fff' });
    lines.forEach((ln, i) => { const kk = SNAP(t - a - 0.08 - i * 0.1); text(ln, 0, -30 + i * 92 + (1 - kk) * 16, { size: 56, weight: 800, color: i ? C.pink : C.mauve, alpha: clamp(kk * 3), maxW: 900 }); });
  }
  g.restore();
}

// ---------- finger / touch ----------
function touchAt(x, y, press, a = 1) { g.save(); g.globalAlpha *= a;
  g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.arc(x, y, 36 + press * 10, 0, Math.PI * 2); g.fill();
  g.strokeStyle = C.pink; g.lineWidth = 6; g.beginPath(); g.arc(x, y, 36 + press * 10, 0, Math.PI * 2); g.stroke();
  g.fillStyle = 'rgba(221,78,148,.35)'; g.beginPath(); g.arc(x, y, 16, 0, Math.PI * 2); g.fill(); g.restore(); }
function pointerAt(st) { const P = window.OVD.pointer; let lo = 0, hi = P.length - 1; if (!P.length || st < P[0][0] - 0.1 || st > P[hi][0] + 0.1) return null;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (P[m][0] <= st) lo = m; else hi = m; } const p = Math.abs(P[lo][0] - st) < Math.abs(P[hi][0] - st) ? P[lo] : P[hi]; return Math.abs(p[0] - st) < 0.12 ? p : null; }
function touches(t, off) {
  const { src, t: st } = srcTime(t); if (src !== 'main' || t >= S.end) return;
  const p = pointerAt(st);
  if (p) { const x = cx(p[1]), y = cy(p[2]) + off; // trail
    for (let k = 1; k <= 6; k++) { const q = pointerAt(st - k * 0.04); if (q) { g.fillStyle = `rgba(221,78,148,${0.18 - k * 0.025})`; g.beginPath(); g.arc(cx(q[1]), cy(q[2]) + off, 28 - k * 2, 0, Math.PI * 2); g.fill(); } }
    touchAt(x, y, 0.3); return; }
  for (const [tt, x, y] of window.OVD.taps) { const d = st - tt; if (d > -0.45 && d < 0.4) { const press = d < 0 ? 0 : Math.sin(clamp(d / 0.25) * Math.PI); touchAt(cx(x), cy(y) + off, press, clamp((d + 0.45) / 0.15) * clamp((0.4 - d) / 0.15)); if (d > 0 && d < 0.35) { g.strokeStyle = `rgba(221,78,148,${1 - d / 0.35})`; g.lineWidth = 5; g.beginPath(); g.arc(cx(x), cy(y) + off, 40 + d * 220, 0, Math.PI * 2); g.stroke(); } } }
}

// ---------- callouts ----------
function pill(x, y, label, bg, fg = '#fff', size = 30) { g.font = `800 ${size}px "Cairo"`; const w = g.measureText(label).width + 44, h = size * 1.75;
  g.save(); g.shadowColor = 'rgba(62,43,71,.25)'; g.shadowBlur = 16; g.shadowOffsetY = 6; rr(x - w / 2, y - h / 2, w, h, h / 2); g.fillStyle = bg; g.fill(); g.restore(); text(label, x, y + 1, { size, color: fg }); }
function ringAround(x, y, r, col, t, dashed = true) { g.save(); g.strokeStyle = col; g.lineWidth = 7; if (dashed) { g.setLineDash([16, 12]); g.lineDashOffset = -t * 60; } g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke(); g.restore(); }
function boxAround(x0, y0, x1, y1, col, t, k) { const p = 10 * (1 - k); g.save(); g.strokeStyle = col; g.lineWidth = 7; g.globalAlpha = clamp(k * 2); rr(cx(x0) - 10 - p, cy(y0) - 10 - p, cx(x1) - cx(x0) + 20 + 2 * p, cy(y1) - cy(y0) + 20 + 2 * p, 34); g.stroke(); g.restore(); }
function itemsAt(st) { const I = window.OVD.items; let best = null, bd = 1; for (const row of I) { const d = Math.abs(row[0] - st); if (d < bd) { bd = d; best = row; } } return bd < 0.08 ? best[1] : []; }
function hazards(t, off) {
  if (!inR(S.hazard, t)) return; const { t: st } = srcTime(t);
  for (const [k, x, y] of itemsAt(st + 0.22)) { if (y < 120 || y > 660) continue; const X = cx(x), Y = cy(y) + off;
    if (k === 'bad') { ringAround(X, Y, 62, C.mauve, t); pill(X + (X > 540 ? -150 : 150), Y - 10, 'تجنبيها ✕', C.mauve); }
    else { ringAround(X, Y, 70, C.pink, t, false); for (let i = 0; i < 4; i++) { const a = t * 3 + i * Math.PI / 2; sparkle(X + Math.cos(a) * 92, Y + Math.sin(a) * 92, 14, C.pink); } pill(X + (X > 540 ? -170 : 170), Y - 10, 'نقاط أكثر ★', C.pink); } }
}
function fever(t, off) {
  if (!inR(S.fever, t)) return; const { t: st } = srcTime(t); if (st < 106.45) return;
  const k = POP(t - (S.fever[0] + (106.45 - 105.3))), p = pointerAt(st); const bx = p ? cx(p[1]) : 540;
  pill(bx, cy(668) + off, 'نقاط ×2', C.pink, '#fff', 34 * clamp(k, 0.01, 1.2));
  const r = rng(3); for (let i = 0; i < 10; i++) { const a = r() * Math.PI * 2, d = 120 + easeOut((t - 11.5) / 0.6) * 260; if (t < 12.4) sparkle(bx + Math.cos(a) * d, cy(700) + off + Math.sin(a) * d * 0.6, 16 * (1 - (t - 11.5) / 0.9), i % 2 ? C.pink : C.gold); }
}
function journeyMark(t, off) { if (!inR(S.journey, t)) return; const k = SOFT(t - S.journey[0] - 0.4); boxAround(115, 155, 275, 315, C.pink, t, k); if (k > 0.2) pill(cx(195), cy(338) + off + 4, 'هدية الشهر', C.pink, '#fff', 28); }
function redeemMark(t, off) { for (const [a, b, i] of S.redeem) if (t >= a && t < b) { const k = SOFT(t - a); const [y0, y1] = i ? [236, 348] : [100, 228]; boxAround(40, y0, 350, y1, C.pink, t, k); } }
function totMark(t, off) { if (!inR(S.tot, t)) return; const k = POP(t - S.tot[0] - 0.3); g.save(); g.translate(cx(195), cy(92) + off); g.scale(k, k); ringAround(0, 0, 150, C.pink, t, false); g.restore(); }
function codeCard(t, off) {
  if (!inR(S.code, t)) return; const a = S.code[0] + 0.7, k = SOFT(t - a); if (k <= 0) return;
  inScreen(off, () => { g.fillStyle = `rgba(43,28,51,${0.45 * clamp(k)})`; g.fillRect(SX, SY, SW, SH); });
  g.save(); g.translate(540, SY + off + 560 + (1 - k) * 120); g.globalAlpha = clamp(k * 2);
  g.save(); g.shadowColor = 'rgba(43,28,51,.35)'; g.shadowBlur = 40; rr(-230, -250, 460, 500, 40); g.fillStyle = C.ivory; g.fill(); g.restore();
  text('كودك', 0, -195, { size: 48, weight: 900, color: C.mauve });
  rr(-190, -140, 380, 110, 26); g.fillStyle = C.lavLL; g.fill(); g.setLineDash([10, 8]); g.strokeStyle = C.lavD; g.lineWidth = 3; rr(-190, -140, 380, 110, 26); g.stroke(); g.setLineDash([]);
  text('KD ● ● ● ● ● ●', 0, -85, { size: 46, weight: 700, family: 'Montserrat', color: C.pink });
  text('صاحبتك تاخذ 10%', 0, 10, { size: 34, weight: 800, color: C.mauve });
  text('وانتي تربحين 10 نقاط', 0, 62, { size: 30, weight: 700, color: C.pinkD });
  text('عن كل طلب يوصل', 0, 104, { size: 30, weight: 700, color: C.pinkD });
  const bk = POP(t - a - 0.5); g.save(); g.translate(0, 180); g.scale(bk, bk); rr(-170, -42, 340, 84, 42); g.fillStyle = C.pink; g.fill(); text('شاركي كودك', 0, 0, { size: 34, weight: 800, color: '#fff' }); g.restore();
  g.restore();
  const tk = t - (a + 2.6); if (tk > -0.45 && tk < 0.4) touchAt(540, SY + off + 740, tk < 0 ? 0 : Math.sin(clamp(tk / 0.25) * Math.PI), clamp((tk + 0.45) / 0.15) * clamp((0.4 - tk) / 0.15));
}
function endCard(t) {
  const a = S.end; if (t < a) return; const k = SOFT(t - a);
  g.save(); g.globalAlpha = clamp((t - a) / 0.25); background(t); g.restore();
  logo(560 - (1 - k) * 60, 560 * (0.9 + 0.1 * k), clamp(k * 2));
  text('العبي واربحي', 540, 800, { size: 130, weight: 900, color: C.mauve, alpha: clamp((t - a - 0.15) * 4) });
  text('هديتك تنتظرك في آخر الرحلة', 540, 930, { size: 50, weight: 600, family: 'Tajawal', color: C.lavD, alpha: clamp((t - a - 0.3) * 4) });
  const bk = POP(t - a - 0.45), press = t > a + 1.6 ? 1 - 0.06 * Math.sin(clamp((t - a - 1.6) / 0.3) * Math.PI) : 1;
  g.save(); g.translate(540, 1140); g.scale(bk * press, bk * press); g.shadowColor = 'rgba(221,78,148,.45)'; g.shadowBlur = 40; g.shadowOffsetY = 14; rr(-300, -78, 600, 156, 78); g.fillStyle = C.pink; g.fill(); g.shadowColor = 'transparent'; text('العبي الآن', 0, 2, { size: 72, weight: 900, color: '#fff' }); g.restore();
  const lk = SNAP(t - a - 0.7); g.save(); g.globalAlpha = clamp(lk * 2); rr(150, 1290, 780, 90, 45); g.fillStyle = 'rgba(250,247,248,.9)'; g.fill(); g.strokeStyle = C.lavL; g.lineWidth = 3; rr(150, 1290, 780, 90, 45); g.stroke();
  text('kara-duo-play-and-win.lovable.app', 540, 1336, { size: 34, weight: 600, family: 'Montserrat', color: C.mauve, maxW: 720 }); g.restore();
  if (t > a + 1.1) { const tk = t - (a + 1.6); if (tk < 0.5) touchAt(lerp(760, 600, easeOut((t - a - 1.1) / 0.45)), lerp(1320, 1160, easeOut((t - a - 1.1) / 0.45)), tk < 0 ? 0 : Math.sin(clamp(tk / 0.25) * Math.PI), clamp((0.5 - tk) / 0.2)); }
  for (let i = 0; i < 8; i++) { const r = rng(40 + i)(); sparkle(140 + i * 115, 1530 + Math.sin(t * 2 + i) * 30, (12 + r * 12) * clamp((t - a - 0.8) * 3), i % 2 ? C.pink : C.lavD, 0.8); }
}

// ---------- frame ----------
const IMG = {};
function draw(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H);
  if (t >= S.end + 0.3) { endCard(t); return; }
  background(t); logo(185, 330);
